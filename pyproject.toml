


[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"




[project]
name = "onmyojiautoscript"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OAS solana"
readme = "README.md"
authors = [
    { name = "runhey" }
]

dependencies = [
    "adbutils==0.11.0",
    "anytree==2.8.0",
    "cn2an==0.5.23",
    "cryptography>=42.0.7",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "msgspec>=0.21.1",
    "numpy>=2.5.3",
    "onepush==1.3.0",
    "opencv-python>=5.0.0.93; sys_platform != 'linux'",
    "opencv-python-headless>=5.0.0.93; sys_platform == 'linux'",
    "paho-mqtt==1.6.1",
    "ppocr-onnx==0.0.3.9",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tqdm==4.65.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "uvicorn==0.38.0",
    "websockets==13.1",
    "wrapt>=1.17.3",
    "zerorpc==0.6.3",
]
[project.optional-dependencies]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "frida>=17.6.2; sys_platform == 'win32'",
    "frida-tools>=14.5.2",
    "oashya; sys_platform == 'win32'",
    "oas-checkin-biggod; sys_platform == 'win32'",
]
# Docker(linux)
linux = []

macos = []

test = [
    "pytest>=8.4.2",
    "pytest-trio>=0.8.0",
    "ruff>=0.16.8",
    "isort>=9.0.1",
]


default = ["onmyojiautoscript[windows,test]"]


# test
# ----------------------------------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require external network access (skip with '--run-network' unset)",
]














[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"




[project]
name = "onmyojiautoscript"
version = "0.1.0"
requires-python = ">=3.14.6"
description = "OAS solana"
readme = "README.md"
authors = [
    { name = "runhey" }
]

dependencies = [
    "adbutils==0.11.0",
    "anytree==2.8.0",
    "cn2an==0.5.23",
    "cron-converter>=2.0.2",
    "cryptography>=42.0.7",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "msgspec>=0.21.1",
    "msgspecerror>=0.22.0.0",
    "numpy>=2.5.3",
    "onepush==1.3.0",
    "opencv-python>=5.0.0.93; sys_platform != 'linux'",
    "opencv-python-headless>=5.0.0.93; sys_platform == 'linux'",
    "paho-mqtt==1.6.1",
    "ppocr-onnx==0.0.3.9",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "rich>=15.0.0",
    "tqdm==4.65.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "uvicorn==0.38.0",
    "websockets==13.1",
    "wrapt>=1.17.3",
    "zerorpc==0.6.3",
    "zstandard>=0.23.0",
]
[project.optional-dependencies]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "frida>=17.6.2; sys_platform == 'win32'",
    "frida-tools>=14.5.2",
    "oashya; sys_platform == 'win32'",
    "oas-checkin-biggod; sys_platform == 'win32'",
]
# Docker(linux)
linux = []

macos = []

test = [
    "pytest>=8.4.2",
    "pytest-trio>=0.8.0",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.16.8",
    "isort>=9.0.1",
]

# uv sync --extra default
default = ["onmyojiautoscript[windows,test]"]


# test
# ----------------------------------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require external network access (skip with '--run-network' unset)",
]
# pytest-benchmark lives entirely on CLI options (no ini keys registered):
# wire the defaults through addopts so every invocation gets them.
#   * --benchmark-skip             plain `pytest` skips benchmarks (fast);
#                                  run them explicitly with `pytest --benchmark-only`
#   * --benchmark-max-time=0.1     default 1.0 spends ~1s calibrating per case
#                                  (30 cases -> ~26s); 0.1s keeps it ~3s
#   * --benchmark-calibration-precision=5
#                                  fewer calibration steps (default 10)
addopts = [
    "--benchmark-skip",
    "--benchmark-max-time=0.1",
    "--benchmark-calibration-precision=5",
]



[tool.ruff]
src = ["."]
target-version = "py314"

[tool.ruff.lint]
select = ["D"]
ignore = [
    "D100",  # 模块缺 docstring
    "D101",  # 公共类缺 docstring
    "D102",  # 公共方法缺 docstring
    "D103",  # 公共函数缺 docstring
    "D104",  # 包（__init__.py）缺 docstring
    "D105",  # 魔法方法缺 docstring
    "D106",  # 嵌套类缺 docstring
    "D107",  # __init__ 缺 docstring
    "D212",  # 摘要不必跟在 """ 同一行（保留仓库现有的换行写法）
    "D200",  # 没有必要在一个行里面
    "D205",
    "D415",  # 摘要末尾必须是 . / ? / !（中文按自己的习惯写，不强制）
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["oas"]

[tool.ruff.format]
quote-style = "single"



